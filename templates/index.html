<!DOCTYPE html>
<html>
<head>
  <title>Churn Insight Agent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h1 class="mb-4">📉 Churn Insight Agent</h1>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Ask a Question (e.g., "Average logins for churned customers"):</label>
        <input type="text" name="question" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Get Insight</button>
      <h2>Welcome to Churn Dashboard</h2>
      <a href="/report">View Churn Report</a>
    </form>

    {% if query %}
      <div class="mt-4">
        <h5>Generated SQL:</h5>
        <pre>{{ query }}</pre>
      </div>
    {% endif %}

    {% if result %}
      <div class="mt-4">
        <h5>Result:</h5>
        {{ result|safe }}
      </div>
    {% endif %}

  </div>
</body>
</html>
